name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 完整轻重验收
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DIGITAL_AUTOMATION_WORKSPACE: ${{ github.workspace }}
      DIGITAL_CI_EVIDENCE: ${{ github.workspace }}/.scratch/ci/full
    steps:
      - name: 检出独立工作区
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 设置 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: 设置 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          cache: true
      - name: 准备本作业临时目录
        run: |
          # 私有控制通道使用 Unix socket，作业临时根保持短路径。
          ci_tmp="$(mktemp -d /tmp/digital-ci.XXXXXXXX)"
          printf 'TMPDIR=%s\n' "$ci_tmp" >> "$GITHUB_ENV"
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 运行相同本地入口
        id: execution
        timeout-minutes: 120
        env:
          TURBO_CONCURRENCY: "2"
        run: pnpm --filter @digital/workspace-automation exec node --conditions=digital-source scripts/ci-environment.ts run
      - name: 停止自有环境并收集真实数据及完整日志
        id: collection
        if: always()
        run: pnpm --filter @digital/workspace-automation exec node --conditions=digital-source scripts/ci-environment.ts collect
      - name: 上传场景证据
        id: upload
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ci-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIGITAL_CI_EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 上传可独立下载的产品数据与完整日志
        id: product_upload
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ci-product-data-and-logs-${{ github.run_id }}-${{ github.run_attempt }}
          # 完整包保留容器文件系统快照；此包只排除这些大快照。
          path: |
            ${{ env.DIGITAL_CI_EVIDENCE }}
            !${{ env.DIGITAL_CI_EVIDENCE }}/**/*-stopped-container.tar
            !${{ env.DIGITAL_CI_EVIDENCE }}/**/*-stopped.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 核实上传产物后显式删除自有环境
        id: deletion
        if: always() && steps.collection.outcome == 'success' && steps.upload.outcome == 'success' && steps.product_upload.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGITAL_CI_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DIGITAL_CI_ARTIFACT_NAME: ci-full-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm --filter @digital/workspace-automation exec node --conditions=digital-source scripts/ci-environment.ts delete
      - name: 分别报告执行、保存、上传与清理结果
        if: always()
        env:
          DIGITAL_CI_EXECUTION_OUTCOME: ${{ steps.execution.outcome }}
          DIGITAL_CI_COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
          DIGITAL_CI_UPLOAD_OUTCOME: ${{ steps.upload.outcome == 'success' && steps.product_upload.outcome == 'success' && 'success' || 'failure' }}
          DIGITAL_CI_DELETION_OUTCOME: ${{ steps.deletion.outcome }}
        run: pnpm --filter @digital/workspace-automation exec node --conditions=digital-source scripts/ci-environment.ts result
